<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --txt:#1f2937; --mut:#6b7280; --line:#e5e7eb; --acc:#0f766e; --bg:#fff; --soft:#f9fafb; --in:#fff; --tab:#f3f4f6; color-scheme: light; }
  * { box-sizing: border-box; }
  body { width: 380px; margin: 0; padding: 12px 14px 14px; font: 13px/1.4 system-ui, "Segoe UI", Arial, sans-serif; color: var(--txt); background: var(--bg); }
  body.tab { width: auto; max-width: 560px; margin: 0 auto; padding-top: 24px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .tabs { display: inline-flex; background: var(--tab); border-radius: 8px; padding: 2px; }
  .tabs button { border: 0; background: none; padding: 5px 14px; border-radius: 6px; font: inherit; color: var(--mut); cursor: pointer; }
  .tabs button.on { background: var(--in); color: var(--txt); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
  .grow { flex: 1; }
  .link { border: 0; background: none; color: var(--mut); font-size: 12px; cursor: pointer; padding: 2px; }
  .link:hover { color: var(--acc); }
  input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; outline: none; background: var(--in); color: var(--txt); }
  input[type=text]:focus { border-color: var(--acc); }
  label { display: block; font-size: 12px; color: var(--mut); margin: 0 0 4px; }
  .btn { width: 100%; margin-top: 10px; padding: 9px; border: 0; border-radius: 8px; background: var(--acc); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.sec { background: var(--in); color: var(--txt); border: 1px solid var(--line); font-weight: 500; }
  .btn:disabled { opacity: .5; cursor: default; }
  .muted { color: var(--mut); font-size: 12px; }
  #estado, #status { margin-top: 8px; min-height: 16px; }
  #status { color: var(--acc); }
  .erro { color: #b91c1c; font-size: 12px; margin-top: 6px; min-height: 0; }
  textarea { width: 100%; height: 280px; margin-top: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font: 12px/1.4 Consolas, monospace; white-space: pre; tab-size: 8; resize: vertical; display: none; background: var(--soft); color: var(--txt); }
  .hide { display: none !important; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row .btn { margin-top: 0; flex: 1; }
  .confirma { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 10px; border: 1px solid #fecaca; background: #fef2f2; border-radius: 8px; font-size: 12.5px; color: #7f1d1d; }
  .confirma span { flex: 1; }
  .confirma .btn { margin-top: 0; width: auto; padding: 6px 10px; font-size: 12px; }
  .btn.danger { background: #b91c1c; }

  /* rota */
  #resultados { margin-top: 10px; max-height: 330px; overflow-y: auto; }
  .grupo { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); margin: 10px 0 4px; }
  .tec { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .tec:last-child { border-bottom: 0; }
  .l1 { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .l1 b { font-weight: 600; }
  .pill { font-size: 10.5px; padding: 0 6px; border-radius: 99px; background: var(--tab); color: var(--mut); }
  .pill.moto { background: #fef3c7; color: #92400e; }
  .pill.carro { background: #e0f2fe; color: #075985; }
  .cidade { color: var(--mut); font-size: 12px; margin-left: auto; }
  .obs { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 4px; background: #fee2e2; color: #991b1b; margin-top: 3px; }
  .obs.n { background: #fef3c7; color: #92400e; }
  .reg { font-size: 12px; color: var(--mut); margin-top: 2px; }
  .reg mark { background: #ccfbf1; color: #134e4a; border-radius: 2px; padding: 0 1px; }
  .end { padding: 8px 10px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; font-size: 12px; margin-bottom: 4px; }
  .end .link { font-size: 12px; padding: 0; text-decoration: underline; }
  #swatches { display: inline-flex; gap: 6px; align-items: center; }
  .sw { width: 15px; height: 15px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); padding: 0; cursor: pointer; }
  .sw:hover { transform: scale(1.15); }
  .sw.on { outline: 2px solid var(--acc); outline-offset: 1.5px; }
  .lista { display: flex; flex-direction: column; }
  .item { display: flex; justify-content: space-between; gap: 10px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--txt); padding: 6px 2px; font: inherit; text-align: left; cursor: pointer; }
  .item:hover { background: var(--soft); }
  .item .muted { text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .chip { border: 1px solid var(--line); background: var(--in); color: var(--txt); border-radius: 99px; padding: 1px 8px; font: inherit; font-size: 11.5px; cursor: pointer; }
  span.chip { cursor: default; }
  .chip:hover { border-color: var(--acc); color: var(--acc); }
  .escolha { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .escolha select { flex: 1; min-width: 0; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 12px; background: var(--in); color: var(--txt); }
  .vazio { color: var(--mut); padding: 14px 0; text-align: center; }
  .rodape { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .aviso { color: #b45309; }

  /* engrenagem e configurações */
  .gear { border: 0; background: none; color: #9ca3af; padding: 2px; margin-left: 2px; cursor: pointer; display: inline-flex; line-height: 0; }
  .gear:hover, .gear.on { color: var(--acc); }
  .cfg { padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .cfg-t { font-weight: 600; margin-bottom: 6px; }
  .cfg-l { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  kbd { font: 12px/1 Consolas, monospace; padding: 4px 8px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; background: var(--soft); color: var(--txt); }
  .cfg-chk { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--txt); margin: 0; cursor: pointer; }
  .cfg-chk input { margin-top: 2px; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" width="22" height="22" style="border-radius:6px">
    <div class="tabs">
      <button data-view="os" class="on">O.S.</button>
      <button data-view="rota">Rota</button>
    </div>
    <span class="grow"></span>
    <span id="swatches" title="Cor do checklist"></span>
    <button class="gear" id="engrenagem" title="Configurações" aria-label="Configurações">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <!-- O.S. -->
  <section id="view-os">
    <label for="nome">Atendente</label>
    <input id="nome" type="text" placeholder="Seu nome" autocomplete="off">
    <div id="estado" class="muted"></div>
    <button class="btn" id="gerar">Gerar O.S.</button>
    <div id="status"></div>
    <div id="erro" class="erro"></div>
    <textarea id="texto" spellcheck="false"></textarea>
    <div class="row hide" id="acoesTexto">
      <button class="btn sec" id="copiar">Copiar</button>
      <button class="btn sec" id="limpar">Limpar</button>
    </div>
    <div class="confirma hide" id="confirma">
      <span>Apagar o texto todo?</span>
      <button class="btn danger" id="simLimpar">Sim, apagar</button>
      <button class="btn sec" id="naoLimpar">Cancelar</button>
    </div>
  </section>

  <!-- Rota -->
  <section id="view-rota" class="hide">
    <input id="busca" type="text" placeholder="Região, bairro ou cidade…" autocomplete="off">
    <div id="rotaInfo" class="muted" style="margin-top:6px"></div>
    <div id="resultados"></div>
    <div class="rodape">
      <button class="link" id="recarregar" title="Buscar a escala de novo">↻ atualizar</button>
      <button class="link" id="abrirSite" title="Abrir o site de O.S. para enviar a nova escala">enviar escala no site ↗</button>
    </div>
  </section>

  <!-- Configurações (engrenagem) -->
  <section id="view-config" class="hide">
    <div class="cfg">
      <div class="cfg-t">Atalho para abrir a extensão</div>
      <div class="cfg-l">
        <kbd id="atalhoTxt">…</kbd>
        <button class="link" id="editarAtalho">editar ↗</button>
      </div>
      <div class="muted" id="atalhoDica">O navegador abre a página de atalhos; lá você troca a tecla da “O.S. Rápido”.</div>
    </div>
    <label class="cfg-chk"><input type="checkbox" id="abrirEmOS"> Abrir sempre na aba O.S. (e deixar o “Gerar O.S.” selecionado)</label>
  </section>

  <script src="rota-lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
